{% extends 'books/base_template.html' %}
{% block content %}
    <h2>Delete Book</h2>
    <p>Are you sure you want to delete "{{ book.title }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>
    <a href="{% url 'book_list' %}">Cancel</a>
{% endblock %}
